name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint and format check with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Source File Line Limit Audit (<= 500 lines)
        run: |
          uv run python -c "
          from pathlib import Path
          import sys
          violations = []
          for p in Path('.').rglob('*.py'):
              if any(part.startswith('.') for part in p.parts) or 'build' in p.parts:
                  continue
              lines = len(p.read_text(encoding='utf-8').splitlines())
              if lines > 500:
                  violations.append(f'{p}: {lines} lines')
          if violations:
              print('Files exceeding 500-line ceiling:\n' + '\n'.join(violations))
              sys.exit(1)
          print('All Python source files satisfy the 500-line limit.')
          "

      - name: Run Test Suite
        run: |
          uv run pytest -v --tb=short
