# Helios Pro v0.4.0 — 1M-context target profile
# Status: TARGET ONLY. The current trained Pro checkpoint is a 96-token
# block-slice checkpoint; this profile describes the serving/training target,
# not a capability that is already present in the weights.
model:
  id: "helios-pro-1m"
  name: "Helios Pro 1M"
  epithet: "Apollo Extended"
  preset: "pro-3b"
  parameters: 3319730000
  layers: 32
  d_model: 3072
  n_heads: 24
  n_kv_heads: 8
  d_ffn: 8192
  context_length: 1000000
  rope_theta: 5000000.0
  tie_embeddings: true
  target_hardware: "Cloud GPU with paged KV cache; 192GB+ unified/HBM for FP16 raw 1M, 96GB+ with INT8 KV"
  default_device: "cuda"

context_extension:
  method: "yarn"
  original_context: 131072
  scale_factor: 7.62939453125
  training_schedule: [4096, 32768, 131072, 262144, 524288, 1000000]
  status: "target_not_trained"
  notes: "Dense attention at 1M needs ~131.1GB KV cache in FP16 for K+V; train with sequence parallelism, not on a 16GB laptop."

serving:
  kv_cache_fp16_gb_at_1m: 131.1
  kv_cache_int8_gb_at_1m: 65.5
  kv_cache_q4_gb_at_1m: 32.8
  weights_fp16_gb: 6.6
  total_fp16_kv_gb_at_1m: 137.7
  total_int8_kv_gb_at_1m: 72.2
  minimum_unified_memory_gb_fp16_kv: 192
  minimum_unified_memory_gb_int8_kv: 96
  local_recommended_raw_context: 32768
  local_1m_mode: "hma_retrieval"
  ollama_env:
    OLLAMA_FLASH_ATTENTION: "1"
    OLLAMA_KV_CACHE_TYPE: "q8_0"
    OLLAMA_NUM_PARALLEL: "1"

capabilities:
  text: "available"
  coding: "target"
  tools: "target"
  mcp: "target_client_side"
  vision: "target_multimodal_adapter"
  long_context: "target"
